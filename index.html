<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTON PRIVATE AI - Wan 2.2 Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #020617; }
        .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(24px); border: 1px solid rgba(120, 60, 255, 0.4); }
        .neon-blue { text-shadow: 0 0 25px #6366f1; }
        .preview { max-height: 240px; border-radius: 16px; object-fit: cover; }
        input[type="range"] { accent-color: #8b5cf6; }
    </style>
</head>
<body class="min-h-screen text-slate-100 p-4">

    <!-- SCREEN 1: LOGIN PIN -->
    <div id="pinScreen" class="glass max-w-sm mx-auto mt-20 p-10 rounded-3xl text-center shadow-2xl">
        <i class="fa-solid fa-robot text-6xl text-indigo-500 mb-6"></i>
        <h1 class="text-3xl font-bold">NTON PRIVATE AI</h1>
        <p class="text-indigo-400 text-sm">Authorized Access Only</p>
        <input type="password" id="pinInput" maxlength="6" inputmode="numeric" placeholder="••••••"
               class="w-full mt-10 bg-black border-2 border-indigo-600 rounded-2xl p-4 text-4xl text-center tracking-widest focus:outline-none text-white">
        <button onclick="auth()" class="w-full mt-6 bg-gradient-to-r from-indigo-600 to-purple-600 p-4 rounded-2xl font-bold hover:opacity-90 transition">MASUK</button>
    </div>

    <!-- SCREEN 2: MAIN DASHBOARD -->
    <div id="mainApp" class="hidden max-w-2xl mx-auto space-y-6 pb-10">
        <div class="flex justify-between items-center py-4">
            <h2 class="text-2xl font-bold neon-blue italic text-indigo-400">WAN 2.2 ULTIMATE</h2>
            <button onclick="location.reload()" class="bg-red-900/40 text-red-400 px-4 py-2 rounded-xl text-xs font-bold border border-red-800">LOGOUT</button>
        </div>

        <div class="glass p-4 rounded-2xl">
            <label class="block text-xs text-slate-400 mb-2 italic">Konfigurasi Cloud API:</label>
            <input type="password" id="hfToken" placeholder="Masukkan Hugging Face Token (hf_...)" 
                   class="w-full p-4 bg-black border border-slate-700 rounded-xl text-sm focus:border-indigo-500 outline-none text-white">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="glass p-5 rounded-3xl text-center">
                <label class="block text-sm mb-3 font-semibold">1. Wajah Target (Foto)</label>
                <input type="file" id="faceImg" accept="image/*" class="hidden" onchange="window.previewFile('faceImg', 'facePreview')">
                <div onclick="document.getElementById('faceImg').click()" class="cursor-pointer w-full h-40 border-2 border-dashed border-indigo-500/50 rounded-2xl flex flex-col items-center justify-center hover:bg-indigo-500/10 transition">
                    <i class="fa-solid fa-camera text-2xl mb-2 text-indigo-400"></i>
                    <span class="text-xs">Unggah Wajah</span>
                </div>
                <img id="facePreview" class="preview mt-3 hidden w-full">
            </div>
            <div class="glass p-5 rounded-3xl text-center">
                <label class="block text-sm mb-3 font-semibold">2. Gerakan (Video)</label>
                <input type="file" id="videoSrc" accept="video/*" class="hidden" onchange="window.previewFile('videoSrc', 'videoPreview')">
                <div onclick="document.getElementById('videoSrc').click()" class="cursor-pointer w-full h-40 border-2 border-dashed border-indigo-500/50 rounded-2xl flex flex-col items-center justify-center hover:bg-indigo-500/10 transition">
                    <i class="fa-solid fa-video text-2xl mb-2 text-indigo-400"></i>
                    <span class="text-xs">Unggah Gerakan</span>
                </div>
                <video id="videoPreview" controls class="preview mt-3 hidden w-full"></video>
            </div>
        </div>

        <div class="glass p-6 rounded-3xl">
            <h3 class="font-bold text-purple-400 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-sliders"></i> ENGINE CONFIG
            </h3>
            <div class="space-y-4">
                <div>
                    <div class="flex justify-between text-xs mb-2 text-slate-400">
                        <span>Face Similarity Strength</span>
                        <span id="strengthVal" class="text-indigo-400 font-mono">0.92</span>
                    </div>
                    <input type="range" id="strength" min="0.5" max="1.0" step="0.01" value="0.92" 
                           class="w-full" oninput="document.getElementById('strengthVal').textContent=this.value">
                </div>
            </div>
        </div>

        <button id="mainBtn" onclick="window.startRender()" 
                class="w-full bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 p-5 rounded-3xl font-bold text-lg shadow-xl active:scale-95 transition">
            <i class="fa-solid fa-bolt mr-2"></i> EXECUTE DEEP RENDER
        </button>

        <div id="resultArea" class="space-y-4"></div>
    </div>

    <!-- SCRIPT LOGIN (Non-Module agar instan) -->
    <script>
        function auth() {
            const pin = document.getElementById('pinInput').value;
            if (pin === "250405") {
                document.getElementById('pinScreen').style.display = 'none';
                document.getElementById('mainApp').classList.remove('hidden');
            } else {
                alert("PIN Salah!");
                document.getElementById('pinInput').value = "";
            }
        }
        // Support Enter Key
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !document.getElementById('pinScreen').classList.contains('hidden')) {
                auth();
            }
        });
    </script>

    <!-- SCRIPT ENGINE (Module untuk Gradio) -->
    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client@0.1.4/dist/index.min.js";

        window.previewFile = (inputId, previewId) => {
            const file = document.getElementById(inputId).files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                const el = document.getElementById(previewId);
                el.src = url;
                el.classList.remove('hidden');
            }
        };

        window.startRender = async () => {
            const token = document.getElementById('hfToken').value.trim();
            const face = document.getElementById('faceImg').files[0];
            const video = document.getElementById('videoSrc').files[0];
            
            if (!token) return alert("API Token Kosong!");
            if (!face || !video) return alert("Pilih foto wajah dan video gerakan!");

            const resultArea = document.getElementById('resultArea');
            const resultBox = document.createElement('div');
            resultBox.className = "glass p-6 rounded-3xl border-l-4 border-indigo-500 mt-4";
            resultBox.innerHTML = `
                <div class="flex items-center gap-3 text-indigo-400 mb-3">
                    <div class="animate-spin h-4 w-4 border-2 border-indigo-500 border-t-transparent rounded-full"></div>
                    <span id="statusMsg" class="font-bold text-xs uppercase tracking-widest">Connecting to GPU...</span>
                </div>
                <div class="h-1 bg-slate-800 rounded-full overflow-hidden">
                    <div id="pBar" class="h-full bg-indigo-500 w-0 transition-all duration-1000"></div>
                </div>
            `;
            resultArea.prepend(resultBox);
            document.getElementById('mainBtn').disabled = true;

            try {
                // Menggunakan Space yang aktif untuk Face Swap/Deepfake
                const client = await Client.connect("Gradio-Official/Face-Swap", { hf_token: token });
                
                document.getElementById('statusMsg').innerText = "Processing Deep Render...";
                document.getElementById('pBar').style.width = "60%";

                const result = await client.predict("/predict", {
                    target_image: face,
                    source_video: video,
                });

                document.getElementById('pBar').style.width = "100%";
                document.getElementById('statusMsg').innerText = "Success!";

                const videoUrl = result.data[0].url;
                resultBox.innerHTML = `
                    <h3 class="text-green-400 font-bold mb-3 flex items-center gap-2 text-sm">
                        <i class="fa-solid fa-circle-check"></i> PROYEK SELESAI
                    </h3>
                    <video controls class="w-full rounded-2xl shadow-lg" src="${videoUrl}"></video>
                `;

            } catch (err) {
                console.error(err);
                resultBox.innerHTML = `<p class="text-red-500 text-xs italic font-bold">Gagal: ${err.message}</p>`;
            }
            document.getElementById('mainBtn').disabled = false;
        };
    </script>
</body>
            </html>
