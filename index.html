<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTON AI LAB - Private Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        input { background: #0f172a !important; border: 1px solid #334155 !important; color: white !important; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center">

    <!-- BAGIAN 1: SISTEM PIN (PENGUNCI) -->
    <div id="layarPin" class="glass mt-20 p-8 rounded-3xl w-full max-w-sm text-center shadow-2xl">
        <h1 class="text-2xl font-bold text-indigo-400 mb-2">Akses Terkunci</h1>
        <p class="text-slate-400 text-sm mb-6">Masukkan PIN Keamanan Anda</p>
        <input type="password" id="inputPin" maxlength="6" inputmode="numeric" placeholder="••••••"
               class="w-full p-4 rounded-xl text-center text-3xl tracking-widest outline-none focus:border-indigo-500 mb-6">
        <button onclick="bukaAkses()" class="w-full bg-indigo-600 p-4 rounded-xl font-bold hover:bg-indigo-700 active:scale-95 transition">MASUK</button>
    </div>

    <!-- BAGIAN 2: DASHBOARD UTAMA (TERSEMBUNYI) -->
    <div id="layarUtama" class="hidden w-full max-w-lg space-y-6">
        <div class="flex justify-between items-center py-4">
            <h2 class="text-xl font-bold text-indigo-400 italic">NTON AI ENGINE v2.2</h2>
            <button onclick="location.reload()" class="text-xs bg-red-900/30 text-red-400 p-2 rounded-lg">KELUAR</button>
        </div>

        <!-- INPUT TOKEN -->
        <div class="glass p-5 rounded-2xl">
            <label class="block text-xs text-slate-400 mb-2 uppercase tracking-wider">Hugging Face API Token:</label>
            <input type="password" id="hfToken" placeholder="hf_xxxxxxxxxxxx" 
                   class="w-full p-3 rounded-lg text-sm outline-none">
        </div>

        <!-- UPLOAD FILES -->
        <div class="grid grid-cols-1 gap-4">
            <div class="glass p-5 rounded-2xl">
                <label class="block text-sm font-semibold mb-3">Target Wajah (Foto):</label>
                <input type="file" id="pilihFoto" accept="image/*" class="w-full text-xs" onchange="previewData('pilihFoto', 'viewFoto')">
                <img id="viewFoto" class="mt-3 hidden rounded-xl max-h-48 w-full object-cover">
            </div>

            <div class="glass p-5 rounded-2xl">
                <label class="block text-sm font-semibold mb-3">Gerakan Video (Source):</label>
                <input type="file" id="pilihVideo" accept="video/*" class="w-full text-xs" onchange="previewData('pilihVideo', 'viewVideo')">
                <video id="viewVideo" controls class="mt-3 hidden rounded-xl w-full"></video>
            </div>
        </div>

        <!-- TOMBOL EKSEKUSI ASLI -->
        <button id="btnRender" onclick="prosesAI()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 p-5 rounded-2xl font-bold text-lg shadow-lg active:scale-95 transition">
            MULAI RENDER WAJAH
        </button>

        <!-- AREA HASIL -->
        <div id="statusRender" class="hidden glass p-6 rounded-2xl border-l-4 border-indigo-500">
            <div class="flex items-center gap-4">
                <div class="animate-spin h-5 w-5 border-2 border-indigo-400 border-t-transparent rounded-full"></div>
                <span id="pesanStatus" class="text-sm font-medium">Menghubungkan ke GPU...</span>
            </div>
        </div>

        <div id="hasilRender" class="hidden glass p-4 rounded-2xl">
            <h3 class="text-green-400 font-bold text-sm mb-3">PROYEK SELESAI:</h3>
            <video id="videoHasil" controls class="w-full rounded-xl shadow-inner"></video>
        </div>
    </div>

    <!-- LOGIKA JAVASCRIPT (ANTI-PAJANGAN) -->
    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client@0.1.4/dist/index.min.js";

        // 1. Fungsi PIN (Dipaksa Global)
        window.bukaAkses = function() {
            const pin = document.getElementById('inputPin').value;
            if (pin === "250405") { // PIN Tanggal Lahir Tuan Anton
                document.getElementById('layarPin').style.display = 'none';
                document.getElementById('layarUtama').classList.remove('hidden');
            } else {
                alert("PIN Salah!");
                document.getElementById('inputPin').value = "";
            }
        };

        // 2. Fungsi Preview
        window.previewData = function(inputId, viewId) {
            const file = document.getElementById(inputId).files[0];
            if (file) {
                const el = document.getElementById(viewId);
                el.src = URL.createObjectURL(file);
                el.classList.remove('hidden');
            }
        };

        // 3. Fungsi Render Asli (Terhubung ke Cloud)
        window.prosesAI = async function() {
            const token = document.getElementById('hfToken').value.trim();
            const foto = document.getElementById('pilihFoto').files[0];
            const video = document.getElementById('pilihVideo').files[0];

            if (!token || !foto || !video) return alert("Lengkapi Token, Foto, dan Video!");

            // Update UI
            document.getElementById('statusRender').classList.remove('hidden');
            document.getElementById('btnRender').disabled = true;
            document.getElementById('btnRender').style.opacity = "0.5";

            try {
                // Koneksi ke Mesin AI asli di Hugging Face
                const client = await Client.connect("Gradio-Official/Face-Swap", { hf_token: token });
                
                document.getElementById('pesanStatus').innerText = "GPU sedang merender wajah Anda...";

                // Mengirim data asli untuk diproses
                const result = await client.predict("/predict", {
                    target_image: foto,
                    source_video: video,
                });

                // Tampilkan Hasil
                document.getElementById('statusRender').classList.add('hidden');
                document.getElementById('hasilRender').classList.remove('hidden');
                document.getElementById('videoHasil').src = result.data[0].url;

            } catch (err) {
                alert("Gagal: " + err.message);
                document.getElementById('statusRender').classList.add('hidden');
            }
            document.getElementById('btnRender').disabled = false;
            document.getElementById('btnRender').style.opacity = "1";
        };
    </script>
</body>
</html>
