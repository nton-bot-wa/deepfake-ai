<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTON AI SWAP - Gratis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-blue { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .loading-pulse { animation: pulse-blue 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-[#0a0a0a] text-zinc-200 min-h-screen flex flex-col items-center p-6 font-sans">

    <div class="max-w-md w-full bg-[#141414] border border-zinc-800 p-8 rounded-[2rem] shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black tracking-tighter text-white">NTON<span class="text-blue-500">AI</span></h1>
            <p class="text-[10px] text-zinc-500 tracking-[0.2em] uppercase mt-1">Deepfake Generator v1.0</p>
        </div>

        <div class="space-y-5">
            <div>
                <label class="text-[10px] font-bold text-zinc-500 ml-1 mb-2 block tracking-widest">HUGGINGFACE TOKEN</label>
                <input type="password" id="hfToken" placeholder="hf_..." 
                       class="w-full bg-[#1c1c1c] border-none p-4 rounded-2xl focus:ring-2 focus:ring-blue-600 outline-none text-sm transition-all">
            </div>

            <div class="grid grid-cols-1 gap-4">
                <div class="bg-[#1c1c1c] p-4 rounded-2xl border border-dashed border-zinc-700">
                    <label class="text-[10px] font-bold text-zinc-400 block mb-2">FOTO TARGET (WAJAH UTAMA)</label>
                    <input type="file" id="targetImg" class="text-xs file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-zinc-800 file:text-zinc-300">
                </div>
                <div class="bg-[#1c1c1c] p-4 rounded-2xl border border-dashed border-zinc-700">
                    <label class="text-[10px] font-bold text-zinc-400 block mb-2">FOTO SUMBER (WAJAH BARU)</label>
                    <input type="file" id="sourceImg" class="text-xs file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-zinc-800 file:text-zinc-300">
                </div>
            </div>

            <button onclick="processSwap()" id="btnGo" 
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl transition-all active:scale-95 shadow-lg shadow-blue-900/20">
                GENERATE SWAP
            </button>
        </div>

        <div id="loader" class="hidden mt-8 text-center space-y-3">
            <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
            <p class="text-xs text-zinc-400 italic" id="statusText">Menghubungkan ke server AI...</p>
        </div>

        <div id="resultBox" class="hidden mt-8 space-y-4 animate-in fade-in zoom-in duration-500">
            <div class="relative">
                <img id="outputImg" class="w-full rounded-3xl border-2 border-zinc-800 shadow-2xl">
                <div class="absolute top-3 right-3 bg-blue-600 text-[8px] font-bold px-2 py-1 rounded-md shadow-lg">AI GENERATED</div>
            </div>
            <a id="dlLink" download="nton_swap.png" 
               class="block text-center w-full py-3 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-sm font-semibold transition-colors">
                Download Hasil
            </a>
        </div>
    </div>

    <footer class="mt-8 text-zinc-600 text-[10px] tracking-widest">
        HOSTED ON GITHUB PAGES • POWERED BY HUGGINGFACE
    </footer>

    <script>
        async function processSwap() {
            const token = document.getElementById('hfToken').value;
            const target = document.getElementById('targetImg').files[0];
            const source = document.getElementById('sourceImg').files[0];

            if (!token || !target || !source) return alert("Lengkapi data: Token, Foto Target, dan Foto Sumber!");

            const btn = document.getElementById('btnGo');
            const loader = document.getElementById('loader');
            const resultBox = document.getElementById('resultBox');
            const statusText = document.getElementById('statusText');

            btn.disabled = true;
            btn.classList.add('opacity-50');
            loader.classList.remove('hidden');
            resultBox.classList.add('hidden');

            try {
                const reader = (f) => new Promise((res) => {
                    const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(f);
                });

                statusText.innerText = "Mengonversi gambar...";
                const targetB64 = await reader(target);
                const sourceB64 = await reader(source);

                statusText.innerText = "Server AI sedang memproses... (10-30 detik)";

                // Menggunakan Model Face Swap stabil di Hugging Face
                const response = await fetch("https://api-inference.huggingface.co/models/vincentshiau/face-swap", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        inputs: {
                            target_image: targetB64,
                            source_image: sourceB64
                        }
                    })
                });

                if (response.status === 503) {
                    alert("Server AI sedang 'tidur'. Saya sedang membangunkannya, coba klik tombol lagi dalam 30 detik!");
                    return;
                }

                if (!response.ok) throw new Error("API Gagal merespon. Cek Token Anda.");

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                
                document.getElementById('outputImg').src = url;
                document.getElementById('dlLink').href = url;
                resultBox.classList.remove('hidden');

            } catch (e) {
                alert("Error: " + e.message);
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
