<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTON AI - Secured</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden-content { display: none; }
        #lockScreen { background: radial-gradient(circle, #1a1a1a 0%, #000 100%); }
    </style>
</head>
<body class="bg-black text-white font-sans">

    <div id="lockScreen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center p-6 transition-all duration-500">
        <div class="mb-8 text-center">
            <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-[0_0_20px_rgba(37,99,235,0.5)]">
                <span class="text-2xl">🔒</span>
            </div>
            <h2 class="text-xl font-bold tracking-widest">NTON SECURE</h2>
            <p class="text-xs text-zinc-500 mt-2">Masukkan 6 digit PIN untuk masuk</p>
        </div>

        <div class="space-y-6 flex flex-col items-center w-full max-w-xs">
            <input type="password" id="pinInput" maxlength="6" 
                   class="w-full bg-zinc-900 border border-zinc-800 text-center text-3xl tracking-[0.5em] p-4 rounded-2xl focus:ring-2 focus:ring-blue-600 outline-none"
                   placeholder="******">
            
            <button onclick="checkPin()" 
                    class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-bold transition-all active:scale-95 shadow-lg shadow-blue-900/20">
                MASUK
            </button>
            <p id="errorMsg" class="text-red-500 text-xs font-bold hidden">PIN SALAH, TUAN!</p>
        </div>
    </div>

    <div id="mainContent" class="hidden-content min-h-screen flex flex-col items-center p-6">
        <div class="max-w-md w-full bg-[#141414] border border-zinc-800 p-8 rounded-[2rem] shadow-2xl mt-10">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black tracking-tighter text-white">NTON<span class="text-blue-500">AI</span></h1>
                <p class="text-[10px] text-zinc-500 tracking-[0.2em] uppercase mt-1">Deepfake Generator v1.0</p>
                <button onclick="location.reload()" class="text-[8px] text-red-800 mt-2">LOGOUT</button>
            </div>

            <div class="space-y-5">
                <div>
                    <label class="text-[10px] font-bold text-zinc-500 ml-1 mb-2 block tracking-widest">HUGGINGFACE TOKEN</label>
                    <input type="password" id="hfToken" placeholder="hf_..." class="w-full bg-[#1c1c1c] border-none p-4 rounded-2xl focus:ring-2 focus:ring-blue-600 outline-none text-sm transition-all text-white">
                </div>

                <div class="grid grid-cols-1 gap-4">
                    <div class="bg-[#1c1c1c] p-4 rounded-2xl border border-dashed border-zinc-700">
                        <label class="text-[10px] font-bold text-zinc-400 block mb-2 uppercase text-center">Foto Target</label>
                        <input type="file" id="targetImg" class="text-xs file:bg-zinc-800 file:text-white file:border-none file:rounded-lg">
                    </div>
                    <div class="bg-[#1c1c1c] p-4 rounded-2xl border border-dashed border-zinc-700">
                        <label class="text-[10px] font-bold text-zinc-400 block mb-2 uppercase text-center">Foto Sumber</label>
                        <input type="file" id="sourceImg" class="text-xs file:bg-zinc-800 file:text-white file:border-none file:rounded-lg">
                    </div>
                </div>

                <button onclick="processSwap()" id="btnGo" class="w-full bg-blue-600 py-4 rounded-2xl font-bold">GENERATE SWAP</button>
            </div>

            <div id="loader" class="hidden mt-8 text-center space-y-3">
                <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p class="text-xs text-zinc-400 italic">Server AI sedang bekerja...</p>
            </div>

            <div id="resultBox" class="hidden mt-8 text-center">
                <img id="outputImg" class="w-full rounded-3xl border-2 border-zinc-800 shadow-2xl mb-4">
                <a id="dlLink" download="nton_swap.png" class="text-blue-500 text-sm font-bold underline">Download Hasil</a>
            </div>
        </div>
    </div>

    <script>
        // --- SISTEM PIN ---
        const MY_PIN = "123456"; // GANTI PIN ANDA DI SINI

        function checkPin() {
            const input = document.getElementById('pinInput').value;
            const lockScreen = document.getElementById('lockScreen');
            const mainContent = document.getElementById('mainContent');
            const errorMsg = document.getElementById('errorMsg');

            if (input === MY_PIN) {
                lockScreen.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    lockScreen.style.display = 'none';
                    mainContent.classList.remove('hidden-content');
                }, 500);
            } else {
                errorMsg.classList.remove('hidden');
                document.getElementById('pinInput').value = "";
                // Getar kalau salah (di HP)
                if (navigator.vibrate) navigator.vibrate(200);
            }
        }

        // --- SISTEM DEEPFAKE (HUGGING FACE) ---
        async function processSwap() {
            const token = document.getElementById('hfToken').value;
            const target = document.getElementById('targetImg').files[0];
            const source = document.getElementById('sourceImg').files[0];

            if (!token || !target || !source) return alert("Lengkapi data!");

            const btn = document.getElementById('btnGo');
            const loader = document.getElementById('loader');
            const resultBox = document.getElementById('resultBox');

            btn.disabled = true;
            loader.classList.remove('hidden');
            resultBox.classList.add('hidden');

            try {
                const reader = (f) => new Promise((res) => {
                    const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(f);
                });

                const tB64 = await reader(target);
                const sB64 = await reader(source);

                const response = await fetch("https://api-inference.huggingface.co/models/vincentshiau/face-swap", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ inputs: { target_image: tB64, source_image: sB64 } })
                });

                if (!response.ok) throw new Error("API Gagal. Coba lagi.");

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                document.getElementById('outputImg').src = url;
                document.getElementById('dlLink').href = url;
                resultBox.classList.remove('hidden');
            } catch (e) {
                alert(e.message);
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
